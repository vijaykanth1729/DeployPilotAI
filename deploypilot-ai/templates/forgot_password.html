{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<section class="py-20 px-4 flex items-center justify-center min-h-[60vh]">
  <div class="w-full max-w-md">
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-cyan-500/10 border border-cyan-500/30 rounded-full flex items-center justify-center mx-auto mb-4">
          <i class="bi bi-envelope-check text-cyan-400 text-2xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-white">Reset your password</h1>
        <p class="text-sm text-gray-400 mt-2">Enter your email and we'll send you a reset link.</p>
      </div>
      <form method="POST" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1">Email address</label>
          <input type="email" name="email" required placeholder="you@company.com"
            class="w-full px-4 py-3 rounded-lg bg-gray-800 border border-gray-700 text-white placeholder-gray-500 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 outline-none transition" />
        </div>
        <button type="submit" class="w-full py-3 rounded-lg bg-gradient-to-r from-cyan-500 to-blue-500 text-white font-bold glow-cyan transition">
          Send Reset Link
        </button>
      </form>
      <div class="text-center mt-6 text-sm text-gray-400">
        Remember your password? <a href="{{ url_for('login') }}" class="text-cyan-400 hover:underline">Sign in</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}

{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<section class="py-20 px-4 flex items-center justify-center min-h-[60vh]">
  <div class="w-full max-w-md">
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-green-500/10 border border-green-500/30 rounded-full flex items-center justify-center mx-auto mb-4">
          <i class="bi bi-shield-lock text-green-400 text-2xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-white">Set new password</h1>
        <p class="text-sm text-gray-400 mt-2">Choose a strong password (min 8 characters).</p>
      </div>
      <form method="POST" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1">New Password</label>
          <div class="relative">
            <input type="password" name="password" id="new_password" required minlength="8" placeholder="••••••••"
              class="w-full px-4 py-3 pr-11 rounded-lg bg-gray-800 border border-gray-700 text-white placeholder-gray-500 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 outline-none transition" />
            <button type="button" class="toggle-pw absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300 transition" data-target="new_password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1">Confirm Password</label>
          <div class="relative">
            <input type="password" name="confirm_password" id="confirm_new_password" required minlength="8" placeholder="••••••••"
              class="w-full px-4 py-3 pr-11 rounded-lg bg-gray-800 border border-gray-700 text-white placeholder-gray-500 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 outline-none transition" />
            <button type="button" class="toggle-pw absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300 transition" data-target="confirm_new_password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="w-full py-3 rounded-lg bg-gradient-to-r from-green-500 to-cyan-500 text-white font-bold transition">
          Reset Password
        </button>
      </form>
    </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
document.querySelectorAll('.toggle-pw').forEach(function(btn) {
    btn.addEventListener('click', function() {
        var input = document.getElementById(this.getAttribute('data-target'));
        var icon = this.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'bi bi-eye';
        }
    });
});
</script>
{% endblock %}

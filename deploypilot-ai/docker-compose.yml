services:
  web:
    build: .
    container_name: deploypilot
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - app_data:/app/instance
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  app_data:
